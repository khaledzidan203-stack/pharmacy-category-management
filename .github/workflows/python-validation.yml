name: Category Analytics Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Category management analytical quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository and evidence contract
        run: python python/repository_validation.py

      - name: Run independent Python QA
        run: python python/category_validation.py

      - name: Run analytical and SQL-source regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python sources
        run: |
          python -m py_compile python/category_validation.py
          python -m py_compile python/repository_validation.py
          python -m py_compile tests/test_python_sample.py
          python -m py_compile tests/test_sql_contract.py
